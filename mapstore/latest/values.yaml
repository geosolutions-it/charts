nameOverride: ""
fullnameOverride: ""

image:
  name: geosolutionsit/mapstore2
  tag: latest

imagePullSecrets: []

podSecurityContext:
  fsGroup: 1001
  runAsNonRoot: true
  runAsUser: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1001

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  nodePort: 30000

ingress:
  className: nginx
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  host: mapstore.local
  path: /mapstore
  pathType: ImplementationSpecific
  # tlsEnabled instructs the ingress to use a certificate from k8s secret. The secret has to the chart name suffixed by -tls. eg: "mapstore-tls"
  tlsEnabled: false

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi

env:
  JAVA_OPTS: "-Xms512m -Xmx512m -Ddatadir.location=/datadir -Dgeostore-ovr=file:///config/geostore-datasource-ovr.properties"
