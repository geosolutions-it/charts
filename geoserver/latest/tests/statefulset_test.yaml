suite: test statefulset
templates:
  - configmap.yml
  - context.xml.tpl
  - secrets.yaml
  - env-properties-secret.yaml
  - statefulset.yaml
tests:
  - it: should create a statefulset
    template: statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: RELEASE-NAME-geoserver

  - it: should set custom image
    template: statefulset.yaml
    set:
      image.repository: custom/geoserver
      image.tag: "2.20.4"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: custom/geoserver:2.20.4

  - it: should have correct labels
    template: statefulset.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: geoserver

  - it: should not set Tomcat max HTTP header size by default
    template: configmap.yml
    asserts:
      - notMatchRegex:
          path: data["server.xml"]
          pattern: 'maxHttpHeaderSize='

  - it: should set Tomcat max HTTP header size
    template: configmap.yml
    set:
      tomcat.httpConnector.maxHttpHeaderSize: 65536
    asserts:
      - matchRegex:
          path: data["server.xml"]
          pattern: 'maxHttpHeaderSize="65536"'

  - it: should keep cache data dir under geoserver data dir by default
    template: statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GEOWEBCACHE_CACHE_DIR
            value: $(GEOSERVER_DATA_DIR)/gwc_cache_dir

  - it: should point cache data dir to dedicated gwccache volume by default
    template: statefulset.yaml
    set:
      persistence.gwccache.accessModes: ReadWriteOnce
      persistence.gwccache.size: 1Gi
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GEOWEBCACHE_CACHE_DIR
            value: /var/geoserver/gwc_cache_dir
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gs-gwccache
            mountPath: /var/geoserver/gwc_cache_dir

  - it: should allow overriding cache data dir when gwccache volume is enabled
    template: statefulset.yaml
    set:
      persistence.gwccache.accessModes: ReadWriteOnce
      persistence.gwccache.size: 1Gi
      geoserver.geoserver_cache_data_dir: /custom/gwc-cache
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GEOWEBCACHE_CACHE_DIR
            value: /custom/gwc-cache

  - it: should keep gwccache default independent from custom data dir
    template: statefulset.yaml
    set:
      persistence.gwccache.accessModes: ReadWriteOnce
      persistence.gwccache.size: 1Gi
      geoserver.geoserver_data_dir: /custom/geoserver/datadir
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GEOSERVER_DATA_DIR
            value: /custom/geoserver/datadir
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GEOWEBCACHE_CACHE_DIR
            value: /var/geoserver/gwc_cache_dir

  - it: should pass HELM_CATALINA_OPTS env variable and deduplicate options in container command
    template: statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HELM_CATALINA_OPTS
            value: "-Xms$(JAVA_XMS) -Xmx$(JAVA_XMX) -Djava.awt.headless=true -server -Dfile.encoding=UTF8 \
              \ -Djavax.servlet.request.encoding=UTF-8 -Djavax.servlet.response.encoding=UTF-8 -XX:SoftRefLRUPolicyMSPerMB=36000 -XX:+UseG1GC \
              \ -XX:MaxGCPauseMillis=200 -XX:ParallelGCThreads=20 -XX:ConcGCThreads=5 -Duser.timezone=UTC -Dorg.geotools.shapefile.datetime=true \
              \ -Dorg.geotools.coverage.jaiext.enabled=\"$(JAI_EXT_ENABLED)\" -DGEOSERVER_LOG_LOCATION=\"$(GEOSERVER_LOG_LOCATION)\" -DGEOWEBCACHE_CONFIG_DIR=\"$(GEOWEBCACHE_CONFIG_DIR)\" \
              \ -DGEOWEBCACHE_CACHE_DIR=$(GEOWEBCACHE_CACHE_DIR) -DNETCDF_DATA_DIR=$(NETCDF_DATA_DIR) -DGRIB_CACHE_DIR=$(GRIB_CACHE_DIR) -DGEOSERVER_CSRF_DISABLED=\"$(GEOSERVER_CSRF_DISABLED)\" \
              \ -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=$(GEOSERVER_HEAP_DUMP_DIR)/$(POD_HOSTNAME).hprof -DGEOSERVER_DATA_DIR=\"$(GEOSERVER_DATA_DIR)\" \
              \ -DGEOSERVER_AUDIT_PATH=\"$(GEOSERVER_AUDIT_PATH)\" -Dpod.hostname=\"$(POD_HOSTNAME)\" \
              \ -DALLOW_ENV_PARAMETRIZATION=true -DPROXY_BASE_URL='$(PROXY_BASE_URL)' -DPROXY_BASE_URL_HEADERS='$(PROXY_BASE_URL_HEADERS)'"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'for opt in \$\{HELM_CATALINA_OPTS\}; do'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'for opt in \$\{CATALINA_OPTS\}; do'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '-Xms\*\) key="-Xms"'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '-Xmx\*\) key="-Xmx"'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '-XX:\*\) key="\$\{opt%%=\*\}"'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '-D\*\)   key="\$\{opt%%=\*\}"'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'echo "\[INFO\] Helm chart overridden CATALINA_OPTS value for '
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'export CATALINA_OPTS="\$\{combined_opts# \}"'
