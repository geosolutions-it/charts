# Verified with prometheus-adapter chart 4.14.1 / adapter v0.12.0.
prometheus:
  url: http://kube-prometheus-stack-prometheus.monitoring.svc
  port: 9090
metricsRelistInterval: 30s
extraArguments:
  - --metrics-max-age=2m
rules:
  default: false
  custom:
    - seriesQuery: 'requests_total_seconds_count{namespace="geoserver",job="geoserver",pod=~"geoserver-[0-9]+"}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: ^requests_total_seconds_count$
        as: geoserver_requests_total_per_second
      # Discovery filters do NOT automatically constrain this query.
      # Healthy scrape targets only; never turn a missing metric into zero.
      metricsQuery: >-
        sum by (<<.GroupBy>>) (
          rate(<<.Series>>{<<.LabelMatchers>>,namespace="geoserver",job="geoserver",pod=~"geoserver-[0-9]+"}[2m])
          and on (namespace,pod,job,instance)
          (up{namespace="geoserver",job="geoserver",pod=~"geoserver-[0-9]+"} == 1)
        )
  external: []
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
logLevel: 4
