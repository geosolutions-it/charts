name: Helm Chart CI

on:
  pull_request:
    branches: [main]

env:
  HELM_VERSION: v3.18.2
  KUBECONFORM_VERSION: 0.7.0
  PYTHON_VERSION: 3.13
  HELM_UNITTEST_VERSION: v1.0.3

jobs:
  helm-ci:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: ${{ env.HELM_VERSION }}

    - name: Install helm-unittest plugin
      run: |
        helm plugin install https://github.com/helm-unittest/helm-unittest --version ${{ env.HELM_UNITTEST_VERSION }}

    - name: Install kubeconform
      run: |
        curl -sSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${{ env.KUBECONFORM_VERSION }}/kubeconform-linux-amd64.tar.gz"
        tar -xzf kubeconform.tar.gz
        sudo mv kubeconform /usr/local/bin/

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up chart-testing
      uses: helm/chart-testing-action@v2

    - name: Set up yamllint
      run: |
        pip install yamllint

    - name: Check changed charts
      run: |
        ct lint --chart-dirs geoserver,mapstore --target-branch ${{ github.event.repository.default_branch }} --validate-maintainers=false

    - name: GeoServer - Unit Tests
      run: |
        echo "::group::Unit testing geoserver/latest"
        helm unittest geoserver/latest
        echo "::endgroup::"

    - name: GeoServer - Kubeconform
      run: |
        echo "::group::Validating geoserver/latest manifests"
        helm template geoserver-test geoserver/latest | kubeconform -summary
        echo "::endgroup::"

    - name: MapStore - Unit Tests
      run: |
        echo "::group::Unit testing mapstore/latest"
        helm unittest mapstore/latest
        echo "::endgroup::"

    - name: MapStore - Kubeconform
      run: |
        echo "::group::Validating mapstore/latest manifests"
        helm template mapstore-test mapstore/latest | kubeconform -summary
        echo "::endgroup::"

  geoserver-install-test:
    runs-on: ubuntu-latest
    needs: helm-ci
    timeout-minutes: 30
    env:
      RELEASE_NAME: geoserver-ci-test
      NAMESPACE: geoserver-ci-test-${{ github.event.pull_request.number }}-${{ github.run_id }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: ${{ env.HELM_VERSION }}

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4

    - name: Create kind cluster
      uses: helm/kind-action@v1
      with:
        cluster_name: geoserver-ci

    - name: Create namespace
      run: |
        kubectl create namespace "$NAMESPACE"

    - name: Install GeoServer chart
      run: |
        helm upgrade --install "$RELEASE_NAME" geoserver/latest \
          --namespace "$NAMESPACE" \
          --values ci-values/geoserver.yaml \
          --atomic \
          --wait \
          --timeout 15m

    - name: GeoServer smoke test
      run: |
        kubectl run geoserver-smoke \
          --namespace "$NAMESPACE" \
          --rm -i \
          --attach=true \
          --restart=Never \
          --image=curlimages/curl:8.10.1 \
          --command -- curl -fsSL --retry 12 --retry-delay 10 --retry-all-errors \
          "http://$RELEASE_NAME/index.html"

    - name: Debug GeoServer install failure
      if: failure()
      run: |
        kubectl get all,pvc,events --namespace "$NAMESPACE" || true
        kubectl logs statefulset/"$RELEASE_NAME" --namespace "$NAMESPACE" --all-containers --tail=200 || true

    - name: Cleanup namespace
      if: always()
      run: |
        kubectl delete namespace "$NAMESPACE" --ignore-not-found

  mapstore-install-test:
    runs-on: ubuntu-latest
    needs: helm-ci
    timeout-minutes: 30
    env:
      RELEASE_NAME: mapstore-ci-test
      NAMESPACE: mapstore-ci-test-${{ github.event.pull_request.number }}-${{ github.run_id }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: ${{ env.HELM_VERSION }}

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4

    - name: Create kind cluster
      uses: helm/kind-action@v1
      with:
        cluster_name: mapstore-ci

    - name: Create namespace
      run: |
        kubectl create namespace "$NAMESPACE"

    - name: Install MapStore chart
      run: |
        helm upgrade --install "$RELEASE_NAME" mapstore/latest \
          --namespace "$NAMESPACE" \
          --values ci-values/mapstore.yaml \
          --atomic \
          --wait \
          --timeout 15m

    - name: MapStore smoke test
      run: |
        kubectl run mapstore-smoke \
          --namespace "$NAMESPACE" \
          --rm -i \
          --attach=true \
          --restart=Never \
          --image=curlimages/curl:8.10.1 \
          --command -- curl -fsSL --retry 12 --retry-delay 10 --retry-all-errors \
          "http://$RELEASE_NAME/mapstore"

    - name: Debug MapStore install failure
      if: failure()
      run: |
        kubectl get all,pvc,events --namespace "$NAMESPACE" || true
        kubectl get pv || true
        kubectl logs statefulset/"$RELEASE_NAME" --namespace "$NAMESPACE" --all-containers --tail=200 || true

    - name: Cleanup namespace
      if: always()
      run: |
        kubectl delete namespace "$NAMESPACE" --ignore-not-found
